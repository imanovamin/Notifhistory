name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/notifhistory
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NotifHistory"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.notifhistory"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.notifhistory"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="История уведомлений"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="История уведомлений"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/notifhistory/Db.kt <<'EOF'
          package com.example.notifhistory

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          data class Item(
              val id: Long,
              val pkg: String,
              val app: String,
              val title: String,
              val text: String,
              val time: Long
          )

          class Db(ctx: Context) : SQLiteOpenHelper(ctx.applicationContext, "notif.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE n(id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                      "pkg TEXT, app TEXT, title TEXT, text TEXT, time INTEGER)"
                  )
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {}

              fun add(pkg: String, app: String, title: String, text: String, time: Long) {
                  // не сохраняем подряд идущие одинаковые уведомления одного приложения
                  readableDatabase.rawQuery(
                      "SELECT title, text FROM n WHERE pkg = ? ORDER BY id DESC LIMIT 1",
                      arrayOf(pkg)
                  ).use { c ->
                      if (c.moveToFirst() && c.getString(0) == title && c.getString(1) == text) return
                  }
                  val v = ContentValues()
                  v.put("pkg", pkg)
                  v.put("app", app)
                  v.put("title", title)
                  v.put("text", text)
                  v.put("time", time)
                  writableDatabase.insert("n", null, v)
              }

              fun list(q: String): List<Item> {
                  val out = ArrayList<Item>()
                  val like = "%" + q + "%"
                  readableDatabase.rawQuery(
                      "SELECT id, pkg, app, title, text, time FROM n " +
                      "WHERE app LIKE ? OR title LIKE ? OR text LIKE ? " +
                      "ORDER BY time DESC LIMIT 2000",
                      arrayOf(like, like, like)
                  ).use { c ->
                      while (c.moveToNext()) {
                          out.add(Item(c.getLong(0), c.getString(1), c.getString(2),
                              c.getString(3), c.getString(4), c.getLong(5)))
                      }
                  }
                  return out
              }

              fun clear() {
                  writableDatabase.delete("n", null, null)
              }
          }
          EOF
          cat > app/src/main/java/com/example/notifhistory/NotifService.kt <<'EOF'
          package com.example.notifhistory

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifService : NotificationListenerService() {

              private val db by lazy { Db(this) }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  try {
                      val n = sbn.notification
                      if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                      val e = n.extras
                      val title = e.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val text = (e.getCharSequence(Notification.EXTRA_BIG_TEXT)
                          ?: e.getCharSequence(Notification.EXTRA_TEXT))?.toString() ?: ""
                      if (title.isEmpty() && text.isEmpty()) return
                      val app = try {
                          packageManager.getApplicationLabel(
                              packageManager.getApplicationInfo(sbn.packageName, 0)
                          ).toString()
                      } catch (ex: Exception) {
                          sbn.packageName
                      }
                      db.add(sbn.packageName, app, title, text, sbn.postTime)
                  } catch (ex: Exception) {
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/notifhistory/MainActivity.kt <<'EOF'
          package com.example.notifhistory

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var db: Db
              private lateinit var list: ListView
              private lateinit var access: Button
              private lateinit var count: TextView
              private var query = ""
              private val fmt = SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = Db(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(32, 72, 32, 16)

                  access = Button(this)
                  access.text = "Включить доступ к уведомлениям"
                  access.setOnClickListener {
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                  }
                  root.addView(access)

                  val search = EditText(this)
                  search.hint = "Поиск по приложению, заголовку, тексту"
                  search.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          query = s?.toString() ?: ""
                          refresh()
                      }
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                  })
                  root.addView(search)

                  count = TextView(this)
                  count.setPadding(0, 16, 0, 16)
                  root.addView(count)

                  list = ListView(this)
                  root.addView(
                      list,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  )

                  val clear = Button(this)
                  clear.text = "Очистить историю"
                  clear.setOnClickListener {
                      AlertDialog.Builder(this)
                          .setMessage("Удалить всю историю уведомлений?")
                          .setPositiveButton("Удалить") { _, _ ->
                              db.clear()
                              refresh()
                          }
                          .setNegativeButton("Отмена", null)
                          .show()
                  }
                  root.addView(clear)

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun hasAccess(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  return s != null && s.contains(packageName)
              }

              private fun refresh() {
                  access.visibility = if (hasAccess()) View.GONE else View.VISIBLE
                  val items = db.list(query)
                  count.text = "Записей: " + items.size
                  val rows = items.map {
                      it.app + "  •  " + fmt.format(Date(it.time)) + "\n" +
                          (if (it.title.isNotEmpty()) it.title + "\n" else "") + it.text
                  }
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, rows)
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Notif History v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
