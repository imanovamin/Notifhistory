          package com.example.notifhistory

          import android.app.Notification
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.io.File
          import java.io.FileOutputStream

          class NotifService : NotificationListenerService() {

              private val db by lazy { Db(this) }
              private var lastImgKey = ""

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  try {
                      if (sbn.packageName.startsWith("com.whatsapp")) {
                          val ctx = applicationContext
                          Thread {
                              try {
                                  Thread.sleep(5000)
                                  Voice.scan(ctx)
                                  Thread.sleep(25000)
                                  Voice.scan(ctx)
                              } catch (e: Exception) {
                              }
                          }.start()
                      }
                      val n = sbn.notification
                      if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                      val e = n.extras
                      val title = e.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val text = (e.getCharSequence(Notification.EXTRA_BIG_TEXT)
                          ?: e.getCharSequence(Notification.EXTRA_TEXT))?.toString() ?: ""
                      val img = saveImage(n, sbn.packageName + "|" + title + "|" + text + "|")
                      if (title.isEmpty() && text.isEmpty() && img.isEmpty()) return
                      val app = try {
                          packageManager.getApplicationLabel(
                              packageManager.getApplicationInfo(sbn.packageName, 0)
                          ).toString()
                      } catch (ex: Exception) {
                          sbn.packageName
                      }
                      db.add(
                          sbn.packageName, app, title, text, sbn.postTime,
                          if (img.isEmpty()) "" else "image", img
                      )
                  } catch (ex: Exception) {
                  }
              }

              private fun saveImage(n: Notification, keyPrefix: String): String {
                  try {
                      val e = n.extras
                      var bmp: Bitmap? = null
                      val p = e.get(Notification.EXTRA_PICTURE)
                      if (p is Bitmap) bmp = p
                      if (bmp == null && Build.VERSION.SDK_INT >= 31) {
                          val ic = e.get(Notification.EXTRA_PICTURE_ICON)
                          if (ic is Icon) {
                              val d = ic.loadDrawable(this)
                              if (d != null) bmp = toBitmap(d)
                          }
                      }
                      if (bmp == null) return ""
                      val key = keyPrefix + bmp.width + "x" + bmp.height
                      if (key == lastImgKey) return ""
                      lastImgKey = key
                      val dir = File(filesDir, "images")
                      dir.mkdirs()
                      val f = File(dir, System.currentTimeMillis().toString() + ".jpg")
                      FileOutputStream(f).use { bmp.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                      return f.absolutePath
                  } catch (ex: Exception) {
                      return ""
                  }
              }

              private fun toBitmap(d: Drawable): Bitmap {
                  val w = if (d.intrinsicWidth > 0) d.intrinsicWidth else 512
                  val h = if (d.intrinsicHeight > 0) d.intrinsicHeight else 512
                  val b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  d.setBounds(0, 0, w, h)
                  d.draw(c)
                  return b
              }
          }
