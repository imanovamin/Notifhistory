          package com.example.notifhistory

          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import java.io.File

          object Voice {

              private val roots = listOf(
                  "Android/media/com.whatsapp/WhatsApp/Media/WhatsApp Voice Notes",
                  "Android/media/com.whatsapp.w4b/WhatsApp Business/Media/WhatsApp Business Voice Notes",
                  "WhatsApp/Media/WhatsApp Voice Notes"
              )

              @Synchronized
              fun scan(ctx: Context) {
                  try {
                      if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) return
                      val prefs = ctx.getSharedPreferences("voice", Context.MODE_PRIVATE)
                      val first = !prefs.contains("seen")
                      val seen = HashSet<String>(prefs.getStringSet("seen", emptySet()) ?: emptySet())
                      val base = Environment.getExternalStorageDirectory()
                      val dir = File(ctx.filesDir, "voice")
                      dir.mkdirs()
                      val db = Db(ctx)
                      for (r in roots) {
                          val root = File(base, r)
                          if (!root.exists()) continue
                          for (f in root.walkTopDown()) {
                              if (!f.isFile) continue
                              val key = f.absolutePath
                              if (seen.contains(key)) continue
                              seen.add(key)
                              // при первом запуске старые записи только помечаем, не копируем
                              if (first) continue
                              val out = File(dir, f.lastModified().toString() + "_" + f.name)
                              f.copyTo(out, true)
                              db.add(
                                  "com.whatsapp", "WhatsApp", "Голосовое сообщение",
                                  "(нажмите, чтобы прослушать)",
                                  System.currentTimeMillis(), "voice", out.absolutePath
                              )
                          }
                      }
                      prefs.edit().putStringSet("seen", seen).apply()
                  } catch (e: Exception) {
                  }
              }
          }
