          package com.example.notifhistory

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import java.io.File

          data class Item(
              val id: Long,
              val pkg: String,
              val app: String,
              val title: String,
              val text: String,
              val time: Long,
              val kind: String,
              val path: String
          )

          class Db(ctx: Context) : SQLiteOpenHelper(ctx.applicationContext, "notif.db", null, 2) {

              private val appCtx: Context = ctx.applicationContext

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE n(id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                      "pkg TEXT, app TEXT, title TEXT, text TEXT, time INTEGER, " +
                      "kind TEXT, path TEXT)"
                  )
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) {
                      db.execSQL("ALTER TABLE n ADD COLUMN kind TEXT")
                      db.execSQL("ALTER TABLE n ADD COLUMN path TEXT")
                  }
              }

              fun add(
                  pkg: String, app: String, title: String, text: String,
                  time: Long, kind: String, path: String
              ) {
                  if (path.isEmpty()) {
                      // не сохраняем подряд идущие одинаковые уведомления одного приложения
                      readableDatabase.rawQuery(
                          "SELECT title, text FROM n WHERE pkg = ? ORDER BY id DESC LIMIT 1",
                          arrayOf(pkg)
                      ).use { c ->
                          if (c.moveToFirst() && c.getString(0) == title && c.getString(1) == text) return
                      }
                  }
                  val v = ContentValues()
                  v.put("pkg", pkg)
                  v.put("app", app)
                  v.put("title", title)
                  v.put("text", text)
                  v.put("time", time)
                  v.put("kind", kind)
                  v.put("path", path)
                  writableDatabase.insert("n", null, v)
              }

              fun list(q: String): List<Item> {
                  val out = ArrayList<Item>()
                  val like = "%" + q + "%"
                  readableDatabase.rawQuery(
                      "SELECT id, pkg, app, title, text, time, kind, path FROM n " +
                      "WHERE app LIKE ? OR title LIKE ? OR text LIKE ? " +
                      "ORDER BY time DESC LIMIT 2000",
                      arrayOf(like, like, like)
                  ).use { c ->
                      while (c.moveToNext()) {
                          out.add(
                              Item(
                                  c.getLong(0),
                                  c.getString(1) ?: "",
                                  c.getString(2) ?: "",
                                  c.getString(3) ?: "",
                                  c.getString(4) ?: "",
                                  c.getLong(5),
                                  c.getString(6) ?: "",
                                  c.getString(7) ?: ""
                              )
                          )
                      }
                  }
                  return out
              }

              fun clear() {
                  writableDatabase.delete("n", null, null)
                  File(appCtx.filesDir, "images").deleteRecursively()
                  File(appCtx.filesDir, "voice").deleteRecursively()
              }
          }
